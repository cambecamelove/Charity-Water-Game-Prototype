<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Free Water</title>

  <!-- CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="home-page">

    <!-- Yellow home header -->
    <header class="top-nav">

      <!-- Home challenge text -->
      <p class="challenge-text">
        Clean Water Challenge
      </p>

      <!-- Charity Water logo in the top right -->
      <a href="https://www.charitywater.org/" target="_blank" class="home-logo-link">
        <img src="images/charity-water-logo.png" alt="Charity Water Logo" class="home-header-logo" />
      </a>

    </header>

    <!-- Main underground water scene -->
    <main class="hero-area" id="waterBarrel">

      <!-- Top dirt layer -->
      <div class="soil-layer"></div>

      <!-- Underground dirty water -->
      <div class="underground-water">

        <div class="water-wave wave-one"></div>
        <div class="water-wave wave-two"></div>

        <span class="water-shine shine-one"></span>
        <span class="water-shine shine-two"></span>
        <span class="water-shine shine-three"></span>

      </div>

      <!-- Dirt pieces -->
      <span class="dirt dirt-one"></span>
      <span class="dirt dirt-two"></span>
      <span class="dirt dirt-three"></span>
      <span class="dirt dirt-four"></span>
      <span class="dirt dirt-five"></span>
      <span class="dirt dirt-six"></span>
      <span class="dirt dirt-seven"></span>
      <span class="dirt dirt-eight"></span>

      <!-- Bacteria pieces -->
      <span class="bacteria bacteria-one"></span>
      <span class="bacteria bacteria-two"></span>
      <span class="bacteria bacteria-three"></span>
      <span class="bacteria bacteria-four"></span>
      <span class="bacteria bacteria-five"></span>
      <span class="bacteria bacteria-six"></span>
      <span class="bacteria bacteria-seven"></span>

      <!-- Worm pieces -->
      <span class="worm worm-one"></span>
      <span class="worm worm-two"></span>
      <span class="worm worm-three"></span>
      <span class="worm worm-four"></span>
      <span class="worm worm-five"></span>
      <span class="worm worm-six"></span>

      <!-- Start gameplay button -->
      <a href="game.html" class="save-lives-button">
        Save Lives
      </a>

    </main>

    <!-- Traditional game footer -->
    <footer class="footer-bar">

      <div class="footer-game-info">
        <h2>Free Water</h2>
        <p>Clean water. Save lives. Learn. Play. Help.</p>
      </div>

      <nav class="footer-links">
        <a href="index.html">Home</a>
        <a href="game.html">Start Mission</a>
        <a href="https://www.charitywater.org/" target="_blank">Charity Water</a>
      </nav>

      <p class="footer-copy">
        © 2026 Free Water Game
      </p>

    </footer>

  </div>

  <!-- JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
